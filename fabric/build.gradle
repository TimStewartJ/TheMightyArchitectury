import net.fabricmc.loom.task.prod.ClientProductionRunTask

def node = rootProject.project(":${stonecutter.current.version}")
def unobf = node.findProperty('unobfuscated') == 'true'
def javaVer = (node.findProperty('java_version') ?: '21') as int
def mcVersion = node.property('minecraft_version')
def floaderVersion = node.property('fabric_loader_version')
def fapiVersion = node.property('fabric_api_version')
def clientTestSessionId = System.getenv("MIGHTYARCHITECT_CLIENT_TEST_SESSION_ID")
    ?.replaceAll("[^A-Za-z0-9._-]", "-")
def clientTestRunDir = clientTestSessionId ? "run-client-test-${clientTestSessionId}" : "run-client-test"
def clientTestResultFile = clientTestSessionId
    ? layout.buildDirectory.file("client-test-${clientTestSessionId}/result.json")
    : layout.buildDirectory.file("client-test/result.json")
def prodClientTestRunDir = clientTestSessionId
    ? "run-prod-client-test-${clientTestSessionId}"
    : "run-prod-client-test"
def prodClientTestResultFile = clientTestSessionId
    ? layout.buildDirectory.file("prod-client-test-${clientTestSessionId}/result.json")
    : layout.buildDirectory.file("prod-client-test/result.json")
def clientTestServer = (System.getenv("MIGHTYARCHITECT_CLIENT_TEST_SERVER")
    ?: project.findProperty("clientTestServer")
    ?: "127.0.0.1:25565").toString()
def clientTestKeepOpen = (System.getenv("MIGHTYARCHITECT_CLIENT_TEST_KEEP_OPEN") ?: "false").toString()

// Source inclusion: this node compiles the matching common node's Stonecutter output alongside its
// own. There is no shared artifact and no bytecode transformer - each loader compiles the shared
// sources against its own mappings, which is what makes dropping Architectury possible.
def commonNode = evaluationDependsOn(":common:${stonecutter.current.version}")
def commonGenerate = commonNode.tasks.named("stonecutterGenerate")

apply plugin: unobf ? "mightyarchitect.loom-noremap" : "mightyarchitect.loom-remap"
apply plugin: "java"
apply plugin: "maven-publish"

base { archivesName = rootProject.archives_base_name }
version = "${rootProject.mod_version}+mc${mcVersion}"
group = rootProject.maven_group

repositories {
    maven { url "https://maven.fabricmc.net/" }
}

sourceSets {
    main {
        java.srcDirs commonNode.sourceSets.main.java.srcDirs
        resources.srcDirs commonNode.sourceSets.main.resources.srcDirs
    }
    clientTest {
        java.srcDirs = [
            rootProject.file("client-test/src/main/java"),
            rootProject.file("fabric/src/clientTest/java")
        ]
        resources.srcDirs = [
            rootProject.file("client-test/src/main/resources"),
            rootProject.file("fabric/src/clientTest/resources")
        ]
        output.resourcesDir = layout.buildDirectory.dir("classes/java/clientTest").get().asFile
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
    serverTest {
        java.srcDirs = [
            rootProject.file("server-test/src/main/java"),
            rootProject.file("fabric/src/serverTest/java")
        ]
        resources.srcDirs = [
            rootProject.file("fabric/src/serverTest/resources")
        ]
        output.resourcesDir = layout.buildDirectory.dir("classes/java/serverTest").get().asFile
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
    // JUnit suite for the mod's pure, version-agnostic logic. Like the other two companions it is
    // NOT Stonecutter-processed, so everything in it has to compile unchanged on every node - which
    // is exactly the property that makes running it on all thirteen of them meaningful.
    test {
        java.srcDirs = [rootProject.file("unit-test/src/main/java")]
        resources.srcDirs = []
    }
}

// The generated common sources are task output, so the dependency has to be declared explicitly -
// adding the directories to a source set does not carry one.
tasks.named("compileJava") { dependsOn commonGenerate }
tasks.named("processResources") { dependsOn commonGenerate }

loom {
    runs {
        automatedClientTest {
            inherit client
            source sourceSets.clientTest
            name "Mighty Architect Automated Client Test"
            runDir clientTestRunDir
            property "mightyarchitect.clientTest.enabled", "true"
            property "mightyarchitect.clientTest.server", clientTestServer
            property "mightyarchitect.clientTest.result",
                clientTestResultFile.get().asFile.absolutePath
            property "mightyarchitect.clientTest.keepOpen", clientTestKeepOpen
        }
        automatedServerTest {
            inherit server
            source sourceSets.serverTest
            name "Mighty Architect Automated Server Test"
            runDir "run-server-test"
            property "mightyarchitect.serverTest.enabled", "true"
        }
    }
}

configurations {
    clientTestImplementation.extendsFrom implementation
    clientTestRuntimeOnly.extendsFrom runtimeOnly
    serverTestImplementation.extendsFrom implementation
    serverTestRuntimeOnly.extendsFrom runtimeOnly
}

configurations.all {
    resolutionStrategy {
        force "net.fabricmc:fabric-loader:${floaderVersion}"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    if (unobf) {
        // Unobfuscated 26.1: no remap, so dependencies are consumed as-is and there are no mappings.
        implementation "net.fabricmc:fabric-loader:${floaderVersion}"
        implementation "net.fabricmc.fabric-api:fabric-api:${fapiVersion}"
    } else {
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${floaderVersion}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fapiVersion}"
    }
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    // Runs the JUnit suite inside a real Fabric Loader (Knot) classloader, the way the game loads
    // the mod, rather than off a plain classpath. Published in lockstep with the loader, so it
    // follows this node's pinned loader version. It brings junit-jupiter-engine and
    // junit-platform-launcher with it; no separate JUnit coordinates are needed.
    testImplementation "net.fabricmc:fabric-loader-junit:${floaderVersion}"
    // The production run loads real mod jars, so Fabric API has to be there as one. This is a
    // plain configuration on purpose: the published artifact is already in the runtime namespace,
    // and routing it through modImplementation would hand the run a dev-mapped jar instead.
    // Non-transitive because the bundle already jar-in-jars every module it depends on - resolving
    // them alongside it would offer Fabric Loader two candidates for each mod id.
    productionRuntimeMods("net.fabricmc.fabric-api:fabric-api:${fapiVersion}") { transitive = false }
    clientTestImplementation sourceSets.main.output
    serverTestImplementation sourceSets.main.output
}

tasks.named("runAutomatedClientTest") {
    dependsOn tasks.named("clientTestClasses")
}

tasks.named("runAutomatedServerTest") {
    dependsOn tasks.named("serverTestClasses")
}

// The unit suite runs on this node's own toolchain and mappings. `test` is already wired into
// `check` -> `build`, so every node's CI job runs it without a workflow change, and locally a
// single node's suite is the seconds-long inner loop the CI matrix cannot be.
def unitTestRunDir = layout.buildDirectory.dir("unit-test-run")

tasks.named("test", Test) {
    useJUnitPlatform()
    dependsOn commonGenerate
    // Fabric Loader's JUnit launcher builds Knot for this side and installs its classloader as the
    // context loader for the whole session. CLIENT is the default and the wider of the two: the
    // mod's shared classes are compiled against the client-inclusive merged jar.
    systemProperty "fabric.side", "client"
    // Booting Minecraft's registries starts its log4j appenders, which write `logs/latest.log`
    // relative to the working directory - and the mod's own storage paths are relative too. Left
    // on the default that is the project directory, so the suite would litter the source tree.
    doFirst { unitTestRunDir.get().asFile.mkdirs() }
    workingDir = unitTestRunDir.get().asFile
    testLogging {
        events "failed"
        exceptionFormat "full"
    }
}

processResources {
    // The blueprint post-process shader is driven from a mixin on Fabric; the post_effect API it
    // targets only exists from 1.21.4, so every older node ships no client mixins of its own.
    def postEffectVersions = ["1.21.4", "1.21.6", "1.21.8", "1.21.10", "1.21.11", "26.1"]
    def includeGameRendererMixin = postEffectVersions.contains(stonecutter.current.version)
    def metaProps = [
        "version"            : project.version,
        "meta_mc_range"      : node.property('meta_mc_range'),
        "meta_mc_max"        : node.property('meta_mc_max'),
        "meta_java_range"    : node.property('meta_java_range'),
        "meta_floader_range" : node.property('fabric_loader_version')
    ]
    inputs.properties(metaProps)
    inputs.property("include_game_renderer_mixin", includeGameRendererMixin)
    filesMatching("fabric.mod.json") {
        expand(metaProps)
    }
    filesMatching(["mightyarchitect.mixins.json", "mightyarchitect.fabric.mixins.json"]) {
        expand(metaProps + ["client_mixins": includeGameRendererMixin ? '["GameRendererMixin"]' : '[]'])
    }
}

// The client-test and server-test companions share one unprocessed resource tree across every
// node, so their mixin config follows this node's Java level rather than a hardcoded one.
def testMetaProps = ["meta_java_range": node.property('meta_java_range')]

tasks.named("processClientTestResources") {
    inputs.properties(testMetaProps)
    filesMatching("mightyarchitect-test.mixins.json") {
        expand(testMetaProps)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = javaVer
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVer)
    }
}

def clientTestJarTask = tasks.register("clientTestJar", Jar) {
    dependsOn tasks.named("clientTestClasses")
    from sourceSets.clientTest.output
    archiveClassifier.set(unobf ? "fabric-client-test" : "fabric-client-test-dev")
}

def packagedClientTestJar
if (unobf) {
    packagedClientTestJar = clientTestJarTask
} else {
    packagedClientTestJar = tasks.register("remapClientTestJar", tasks.named("remapJar").get().class) {
        inputFile.set(clientTestJarTask.flatMap { it.archiveFile })
        dependsOn clientTestJarTask
        archiveClassifier.set("fabric-client-test")
        // RemapJarTask seeds its remap classpath with `compileClasspath`, which holds the mod's
        // dependencies but not the mod. Tiny-remapper only renames an override when it can see the
        // hierarchy that declares it, so without the mod's own classes here it could not tell that
        // WrappedWorld extends Level: the companion went on calling `getBlockState` while the mod
        // jar renamed the same method to `method_8320`, and the two jars first met at runtime, as a
        // NoSuchMethodError. Remap the companion against exactly what it compiled against.
        classpath.from sourceSets.clientTest.compileClasspath
    }
}

tasks.register("buildClientTestMod") {
    group = "verification"
    description = "Builds the distributable Fabric client-test companion mod."
    dependsOn packagedClientTestJar
}

// Production client test. `runAutomatedClientTest` above launches the game from the dev classpath
// under Mojang names; this launches the *packaged* jars the way a launcher does - remapped
// artifacts, intermediary names on every obfuscated node, and none of the dev-only classpath.
// That is the layer where a name-bound reflective lookup or a mis-declared dependency shows up,
// and until now nothing in CI ran it.
//
// There is no launcher to write: Loom's ClientProductionRunTask resolves the client jar,
// fabric-loader, intermediary (only where the production namespace is intermediary) and the
// client runtime libraries itself, and depends on `downloadAssets`. It also seeds `mods` with
// this node's own production artifact - `remapJar`, or `jar` where Loom does not remap - so only
// the companion and Fabric API have to be named here.
tasks.register("runProductionClientTest", ClientProductionRunTask) {
    group = "verification"
    description = "Runs the automated client test against the packaged production jars."

    mods.from packagedClientTestJar
    runDir = layout.projectDirectory.dir(prodClientTestRunDir)

    jvmArgs.addAll(
        "-Dmightyarchitect.clientTest.enabled=true",
        "-Dmightyarchitect.clientTest.server=${clientTestServer}".toString(),
        "-Dmightyarchitect.clientTest.result=${prodClientTestResultFile.get().asFile.absolutePath}".toString(),
        "-Dmightyarchitect.clientTest.keepOpen=${clientTestKeepOpen}".toString()
    )

    // Vanilla's Main marks --accessToken and --version `required()` on every version in the
    // matrix (checked on 1.19.4, 1.21.8 and 26.2), and Loom supplies neither - it passes only
    // --assetIndex, --assetsDir and --gameDir. Nothing here authenticates anything; an
    // online-mode=false server never asks. The option parser simply refuses to start without
    // them present, so the values are placeholders. --username is pinned only so the player
    // shows up under a recognisable name in the server log.
    programArgs.addAll(
        "--accessToken", "0",
        "--version", "mightyarchitect-prod-test",
        "--username", "ArchitectTest"
    )

    // Loom turns XVFB on by itself whenever CI is set on Linux, but with xvfb-run's default
    // screen. Both client matrices instead run under one explicitly sized 24-bit display, so a
    // screenshot assertion sees the same framebuffer in dev and in production and any difference
    // is attributable to the runtime rather than the display. Leave the display to the caller
    // unless it is asked for.
    useXVFB = Boolean.parseBoolean((project.findProperty("prodClientTestXvfb") ?: "false").toString())

    // javaLauncher is left on its convention, which is this project's own toolchain - the same
    // JDK the dev run and the node's compile use.
}

if (unobf) {
    // Unobfuscated 26.1: Loom performs no remap, so the plain jar is the published artifact.
    jar {
        archiveClassifier.set("fabric")
    }
} else {
    remapJar {
        archiveClassifier.set("fabric")
    }
    jar {
        archiveClassifier.set("dev")
    }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-fabric"
            from components.java
        }
    }
    repositories {}
}
