def node = rootProject.project(":${stonecutter.current.version}")
def unobf = node.findProperty('unobfuscated') == 'true'
def javaVer = (node.findProperty('java_version') ?: '21') as int
def mcVersion = node.property('minecraft_version')
def archVersion = node.property('architectury_version')
def floaderVersion = node.property('fabric_loader_version')
def fapiVersion = node.property('fabric_api_version')
def commonProject = ":common:${stonecutter.current.version}"

// Force the matching common node to evaluate first, then read its architectury transform output +
// compiled classes DIRECTLY off the project object. This keeps architectury's bytecode transform
// (which converts common's fabric-dialect @Environment/EnvType for each loader and compiles common
// only once) while avoiding project(path, configuration:) cross-project resolution, which yields
// "no variant exists" between sibling Stonecutter nodes.
def commonNode = evaluationDependsOn(commonProject)

apply plugin: unobf ? "mightyarchitect.loom-noremap" : "mightyarchitect.loom-remap"
apply plugin: "mightyarchitect.shadow"
apply plugin: "java"
apply plugin: "maven-publish"

base { archivesName = rootProject.archives_base_name }
version = "${rootProject.mod_version}+mc${mcVersion}"
group = rootProject.maven_group

repositories {
    maven { url "https://maven.neoforged.net/releases/" }
}

architectury {
    platformSetupLoomIde()
    fabric()
}

sourceSets {
    clientTest {
        java.srcDirs = [
            rootProject.file("client-test/src/main/java"),
            rootProject.file("fabric/src/clientTest/java")
        ]
        resources.srcDirs = [
            rootProject.file("client-test/src/main/resources"),
            rootProject.file("fabric/src/clientTest/resources")
        ]
        output.resourcesDir = layout.buildDirectory.dir("classes/java/clientTest").get().asFile
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
}

loom {
    silentMojangMappingsLicense()

    runs {
        automatedClientTest {
            inherit client
            source sourceSets.clientTest
            name "Mighty Architect Automated Client Test"
            runDir "run-client-test"
            property "mightyarchitect.clientTest.enabled", "true"
            property "mightyarchitect.clientTest.server",
                (System.getenv("MIGHTYARCHITECT_CLIENT_TEST_SERVER")
                    ?: project.findProperty("clientTestServer")
                    ?: "127.0.0.1:25565").toString()
            property "mightyarchitect.clientTest.result",
                layout.buildDirectory.file("client-test/result.json").get().asFile.absolutePath
        }
        automatedServerTest {
            inherit server
            name "Mighty Architect Automated Server Test"
            runDir "run-server-test"
        }
    }
}

configurations {
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
    // Dependency bucket for common's named (dev) classes+resources. Extending compileClasspath +
    // runtimeClasspath + developmentFabric from it mirrors the canonical architectury loader wiring:
    // developmentFabric is what architectury-loom hands to the dev run as the mod-in-dev, so common
    // classes are resolvable at dev runtime (runClient). Plain runtimeOnly does NOT reach that layer.
    common {
        canBeResolved = false
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

configurations {
    clientTestImplementation.extendsFrom implementation, common
    clientTestRuntimeOnly.extendsFrom runtimeOnly
}

configurations.all {
    resolutionStrategy {
        force "net.fabricmc:fabric-loader:${floaderVersion}"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    if (unobf) {
        implementation "net.fabricmc:fabric-loader:${floaderVersion}"
        implementation "net.fabricmc.fabric-api:fabric-api:${fapiVersion}"
        implementation "dev.architectury:architectury-fabric:${archVersion}"
    } else {
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${floaderVersion}"
        modApi "net.fabricmc.fabric-api:fabric-api:${fapiVersion}"
        modApi "dev.architectury:architectury-fabric:${archVersion}"
    }

    // common's named (dev) classes+resources as a JAR — feeds the loader's compile classpath (to
    // compile the fabric/ source, which imports common) AND the dev-run classpath via
    // developmentFabric. Must be a jar (not raw output dirs): architectury's dev-time transformer
    // opens developmentFabric entries as jar filesystems. The packaged jar uses the transformed copy.
    common files(commonNode.tasks.named('jar').flatMap { it.archiveFile })
    // The architectury-transformed common jar, bundled into the final jar via shadow.
    shadowBundle commonNode.configurations.getByName("transformProductionFabric").artifacts.files
    clientTestImplementation sourceSets.main.output
}

// Ensure common is compiled/transformed before this loader compiles or bundles.
tasks.named("compileJava") {
    dependsOn commonNode.tasks.named("classes")
}

tasks.named("runAutomatedClientTest") {
    dependsOn tasks.named("clientTestClasses")
}

processResources {
    def includeGameRendererMixin = stonecutter.current.version != "1.21.1"
    def mixinProps = [
        "client_mixins": includeGameRendererMixin ? '["GameRendererMixin"]' : '[]'
    ]
    def metaProps = [
        "version"                 : project.version,
        "meta_mc_range"           : node.property('meta_mc_range'),
        "meta_java_range"         : node.property('meta_java_range'),
        "meta_floader_range"      : node.property('fabric_loader_version'),
        "meta_architectury_range" : node.property('meta_architectury_range')
    ]
    inputs.properties(metaProps)
    inputs.property("include_game_renderer_mixin", includeGameRendererMixin)
    filesMatching("fabric.mod.json") {
        expand(metaProps)
    }
    filesMatching("mightyarchitect.mixins.json") {
        expand(mixinProps)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = javaVer
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVer)
    }
}

def clientTestJarTask = tasks.register("clientTestJar", Jar) {
    dependsOn tasks.named("clientTestClasses")
    from sourceSets.clientTest.output
    archiveClassifier.set(unobf ? "fabric-client-test" : "fabric-client-test-dev")
}

def packagedClientTestJar
if (unobf) {
    packagedClientTestJar = clientTestJarTask
} else {
    packagedClientTestJar = tasks.register("remapClientTestJar", tasks.named("remapJar").get().class) {
        inputFile.set(clientTestJarTask.flatMap { it.archiveFile })
        dependsOn clientTestJarTask
        archiveClassifier.set("fabric-client-test")
    }
}

tasks.register("buildClientTestMod") {
    group = "verification"
    description = "Builds the distributable Fabric client-test companion mod."
    dependsOn packagedClientTestJar
}

if (unobf) {
    // Unobfuscated 26.1: no remap step. The plain jar is unpacked into the shadowJar, which bundles
    // the transformed common classes and becomes the published fabric artifact.
    jar {
        archiveClassifier.set("raw")
    }
    shadowJar {
        dependsOn(jar)
        mainSpec.sourcePaths.clear()
        from(zipTree(jar.archiveFile))
        exclude "architectury.common.json"
        configurations = [project.configurations.shadowBundle]
        archiveClassifier.set("fabric")
    }
} else {
    // Obfuscated: shadow the transformed common with the loader classes, then remap named -> intermediary.
    shadowJar {
        exclude "architectury.common.json"
        configurations = [project.configurations.shadowBundle]
        archiveClassifier.set("dev-shadow")
    }
    remapJar {
        inputFile.set shadowJar.archiveFile
        dependsOn shadowJar
        archiveClassifier.set("fabric")
    }
    jar {
        archiveClassifier.set("dev")
    }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-fabric"
            from components.java
        }
    }
    repositories {}
}
