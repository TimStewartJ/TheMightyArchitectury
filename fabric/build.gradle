def node = rootProject.project(":${stonecutter.current.version}")
def unobf = node.findProperty('unobfuscated') == 'true'
def javaVer = (node.findProperty('java_version') ?: '21') as int
def mcVersion = node.property('minecraft_version')
def archVersion = node.property('architectury_version')
def floaderVersion = node.property('fabric_loader_version')
def fapiVersion = node.property('fabric_api_version')
def commonProject = ":common:${stonecutter.current.version}"

// Force the matching common node to evaluate first, then read its architectury transform output +
// compiled classes DIRECTLY off the project object. This keeps architectury's bytecode transform
// (which converts common's fabric-dialect @Environment/EnvType for each loader and compiles common
// only once) while avoiding project(path, configuration:) cross-project resolution, which yields
// "no variant exists" between sibling Stonecutter nodes.
def commonNode = evaluationDependsOn(commonProject)

apply plugin: unobf ? "mightyarchitect.loom-noremap" : "mightyarchitect.loom-remap"
apply plugin: "mightyarchitect.shadow"
apply plugin: "java"
apply plugin: "maven-publish"

base { archivesName = "${rootProject.archives_base_name}-${mcVersion}" }
version = rootProject.mod_version
group = rootProject.maven_group

repositories {
    maven { url "https://maven.neoforged.net/releases/" }
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    silentMojangMappingsLicense()
}

configurations {
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

configurations.all {
    resolutionStrategy {
        force "net.fabricmc:fabric-loader:${floaderVersion}"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    if (unobf) {
        implementation "net.fabricmc:fabric-loader:${floaderVersion}"
        implementation "net.fabricmc.fabric-api:fabric-api:${fapiVersion}"
        implementation "dev.architectury:architectury-fabric:${archVersion}"
    } else {
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${floaderVersion}"
        modApi "net.fabricmc.fabric-api:fabric-api:${fapiVersion}"
        modApi "dev.architectury:architectury-fabric:${archVersion}"
    }

    // common's compiled classes on this loader's compile classpath (to compile the loader's own
    // fabric/ source, which imports common). Direct project-object output, not a project() variant.
    compileOnly commonNode.sourceSets.main.output
    // The architectury-transformed common jar, bundled into the final jar via shadow.
    shadowBundle commonNode.configurations.getByName("transformProductionFabric").artifacts.files
}

// Ensure common is compiled/transformed before this loader compiles or bundles.
tasks.named("compileJava") {
    dependsOn commonNode.tasks.named("classes")
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = javaVer
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVer)
    }
}

if (unobf) {
    // Unobfuscated 26.1: no remap step. The plain jar is unpacked into the shadowJar, which bundles
    // the transformed common classes and becomes the published fabric artifact.
    jar {
        archiveClassifier.set("raw")
    }
    shadowJar {
        dependsOn(jar)
        mainSpec.sourcePaths.clear()
        from(zipTree(jar.archiveFile))
        exclude "architectury.common.json"
        configurations = [project.configurations.shadowBundle]
        archiveClassifier.set("fabric")
    }
} else {
    // Obfuscated: shadow the transformed common with the loader classes, then remap named -> intermediary.
    shadowJar {
        exclude "architectury.common.json"
        configurations = [project.configurations.shadowBundle]
        archiveClassifier.set("dev-shadow")
    }
    remapJar {
        inputFile.set shadowJar.archiveFile
        dependsOn shadowJar
        archiveClassifier.set("fabric")
    }
    jar {
        archiveClassifier.set("dev")
    }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-fabric"
            from components.java
        }
    }
    repositories {}
}
