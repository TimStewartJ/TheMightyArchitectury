plugins {
    id "com.gradleup.shadow" version "9.6.1"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

repositories {
    maven { url "https://maven.cafeteria.dev/releases/" }   // Sodium / Iris snapshots
    maven { url "https://api.modrinth.com/maven" }          // Modrinth releases
}

loom {
    runs {
        clientWithSodium {
            client()
            name = "Fabric Client (Sodium + Iris)"
            source sourceSets.main
            vmArgs "-Dfabric.development=true"
        }
    }
}

// Sodium/Iris testing - enable with: ./gradlew runClientWithSodium -PwithSodium
if (project.hasProperty("withSodium")) {
    dependencies {
        // Sodium 0.6.0 for 1.21.1
        runtimeOnly "maven.modrinth:sodium:mc1.21.1-0.6.13-fabric"
        // Iris 1.8.0 for 1.21.1
        runtimeOnly "maven.modrinth:iris:1.8.8+1.21.1-fabric"
        // Iris transitive dependencies (not pulled from Modrinth maven)
        runtimeOnly "org.anarres:jcpp:1.4.14"
        runtimeOnly "io.github.douira:glsl-transformer:2.0.1"
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

configurations.all {
    resolutionStrategy {
        force "net.fabricmc:fabric-loader:$fabric_loader_version"
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    // Remove the next line if you don't want to depend on the API
    implementation "dev.architectury:architectury-fabric:${rootProject.architectury_version}"

    common(project(path: ":common")) { transitive false }
    shadowBundle project(path: ":common", configuration: "transformProductionFabric")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// Minecraft 26.1+ is unobfuscated, so there is no remap step. The plain jar
// (with Loom's modifications) is unpacked into the shadowJar, which bundles the
// transformed common classes and becomes the published mod artifact.
jar {
    archiveClassifier.set("raw")
}

shadowJar {
    dependsOn(jar)
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))

    exclude "architectury.common.json"
    configurations = [project.configurations.shadowBundle]
    archiveClassifier.set("fabric")
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
