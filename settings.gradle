pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.neoforged.net/releases/" }
        maven { url "https://maven.kikugie.dev/releases" }
        maven { url "https://maven.kikugie.dev/snapshots" }
        gradlePluginPortal()
    }
}

plugins {
    id("dev.kikugie.stonecutter").version "0.9.7"
}

include("common")
include("fabric")
include("neoforge")

// --- Stonecutter POC -------------------------------------------------------
// Scoped to the `common` module (where all version-divergent Minecraft-API code lives).
// `common` becomes a Stonecutter tree with one node per supported Minecraft version.
stonecutter {
    // The project uses Groovy Gradle scripts, so opt out of the Kotlin controller default.
    kotlinController = false
    centralScript = "build.gradle"

    create("common") {
        versions "26.1", "1.21.8"
        vcsVersion = "26.1"
    }
}
// ---------------------------------------------------------------------------

rootProject.name = "TheMightierArchitect"
