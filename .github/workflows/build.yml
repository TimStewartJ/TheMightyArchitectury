name: Build (all versions)

on:
  # Every branch, but not tags: a version tag is built once, by release.yml calling this workflow,
  # so the same commit is not put through the matrix twice. Branch pushes still run on their own,
  # which is what lets a throwaway branch serve as a mutation test without opening a PR.
  push:
    branches: ['**']
  # A pull request from a branch of this repository is already built by that branch's push, and
  # the required check lands on the same commit either way, so the jobs below skip themselves for
  # it (see `all-green`). The event stays for forks, whose pushes run nothing here.
  pull_request:
  workflow_call:
  # Every five days on main. Toolchains, loader builds and Mojang's CDN drift whether or not
  # anyone pushes, and this finds out before a release does. It also keeps main's caches alive:
  # GitHub drops a cache nothing has read for seven days, and work here comes in bursts weeks
  # apart. (GitHub disables schedules after 60 days without repository activity.)
  schedule:
    - cron: '17 9 */5 * *'

concurrency:
  # The event is part of the group so a scheduled build and a push to main never cancel each other.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Cheap structural gate, in parallel with the build jobs. Guards the bug class PR #34 vs #32
  # demonstrated: a guard that wraps a whole file gives every version its own copy of the shared
  # logic, so a fix applied to one copy silently misses the others. Marker counts hide it - one
  # guard can wrap hundreds of duplicated lines - so this looks for the repeated `package`
  # declaration a duplicated compilation unit necessarily carries.
  source-shape:
    name: Source shape
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No whole-file guarded duplicates
        shell: pwsh
        run: ./scripts/check-source-shape.ps1 -Detail

  # Keeps the shared asset store current. Nothing waits for it: a build that runs before the store
  # exists downloads its assets as it always did, and the next one finds them cached. On main only,
  # like every other cache save here: a store saved from a branch is readable by that branch alone.
  assets:
    name: Shared Minecraft assets
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/minecraft-assets
        with:
          warm: true

  build:
    name: MC ${{ matrix.mc }}
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One job per Minecraft version; each builds every loader that version targets (they share
        # the :common:<mc> compile under Stonecutter, so pairing them avoids a double compile).
        #
        # `loader2` is the Forge-family loader for that version:
        #   forge     - 1.19.4 and 1.20.1, which predate NeoForge (and NeoForge 1.20.1 loads Forge mods)
        #   neoforge  - 1.20.4 and newer
        #   ""        - 1.20.2, which is Fabric-only: ModDevGradle resolves NeoForge through Gradle
        #               module metadata and no 20.2 or 20.3 build ever published any.
        include:
          - { mc: "1.19.4",  loader2: forge }
          - { mc: "1.20.1",  loader2: forge }
          - { mc: "1.20.2",  loader2: "" }
          - { mc: "1.20.4",  loader2: neoforge }
          - { mc: "1.20.6",  loader2: neoforge }
          - { mc: "1.21.1",  loader2: neoforge }
          - { mc: "1.21.4",  loader2: neoforge }
          - { mc: "1.21.6",  loader2: neoforge }
          - { mc: "1.21.8",  loader2: neoforge }
          - { mc: "1.21.10", loader2: neoforge }
          - { mc: "1.21.11", loader2: neoforge }
          - { mc: "26.1",    loader2: neoforge }
          - { mc: "26.2",    loader2: neoforge }
          - { mc: "26.3",    loader2: neoforge }
    steps:
      - uses: actions/checkout@v7
        with:
          # Root build.gradle derives the CI version from `git rev-list --count HEAD`.
          fetch-depth: 0

      # Install every toolchain the matrix needs: 1.19.4..1.20.4 target JDK 17, the remaining
      # obf nodes (<=1.21.x) use JDK 21, and the unobfuscated 26.x nodes use JDK 25.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      # Writes its cache from main only, which is the rule every cache in this file follows: a
      # cache saved from a branch or a tag is invisible to everything else and only crowds out
      # the ones that are shared. (v5, not v6: v6 makes the caching a separately licensed
      # component - a decision, not a bump.)
      #
      # Loom's and NeoForm's per-version work is not cached. setup-gradle saves one Gradle home per
      # job and per commit, and the first main build saved 11.2 GB of them - more than the
      # repository's whole 10 GB, saved last, so least-recently-used eviction would have taken the
      # shared asset store and the HeadlessMc caches first. Measured in PR #51, per job: Gradle's
      # own generated files save ~40 s and the dependency cache ~20 s, and both are kept; Loom's
      # and NeoForm's files would save roughly another 40 s, but they are the largest part of a
      # home (~470 MB a job) and do not fit beside the rest. The asset store and HeadlessMc save
      # about a minute a job and thousands of CDN requests, so they get the room.
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-home-cache-excludes: |
            caches/fabric-loom
            caches/neoformruntime

      # HeadlessMc installs a full Minecraft plus loader for the production client lane: the game
      # jar, its libraries and the installed loader, per Minecraft version. Restored everywhere,
      # saved from main only (after the production lane, below).
      - name: Restore HeadlessMc Minecraft
        id: hmc
        if: matrix.loader2 != ''
        uses: actions/cache/restore@v6
        with:
          path: build/headlessmc
          key: hmc2-${{ runner.os }}-${{ matrix.mc }}-${{ hashFiles(format('versions/{0}/gradle.properties', matrix.mc)) }}
          restore-keys: hmc2-${{ runner.os }}-${{ matrix.mc }}-

      # After both restores, so the links replace whatever an older cache put in their place.
      - uses: ./.github/actions/minecraft-assets

      - name: Build ${{ matrix.mc }}
        env:
          JDKS: JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64
        run: |
          chmod +x ./gradlew
          tasks=":fabric:${{ matrix.mc }}:build"
          if [ -n "${{ matrix.loader2 }}" ]; then
            tasks="$tasks :${{ matrix.loader2 }}:${{ matrix.mc }}:build"
          fi
          ./gradlew $tasks -Porg.gradle.java.installations.fromEnv=$JDKS --stacktrace

      # Guards the exact bug packaged E2E caught: metadata must declare THIS version's
      # dependency range, not the newest node's hardcoded one. Expected values are read from
      # the version's own gradle.properties so the assertion cannot drift from the build.
      - name: Verify mod metadata version range
        run: |
          set -euo pipefail
          props="versions/${{ matrix.mc }}/gradle.properties"
          prop() { grep -E "^$1=" "$props" | head -n1 | cut -d= -f2- | tr -d '\r'; }
          mc_min=$(prop meta_mc_range)
          mc_max=$(prop meta_mc_max)
          pack_format=$(prop meta_pack_format)
          [ -n "$mc_min" ] && [ -n "$mc_max" ] && [ -n "$pack_format" ] \
            || { echo "::error::$props is missing meta_mc_range, meta_mc_max or meta_pack_format"; exit 1; }

          if [ -n "${{ matrix.loader2 }}" ]; then
            l2_jar=$(ls ${{ matrix.loader2 }}/versions/${{ matrix.mc }}/build/libs/*${{ matrix.loader2 }}.jar \
              | grep -Ev 'sources|dev|raw|client-test|server-test' | head -n1)
            # Forge reads META-INF/mods.toml; NeoForge reads META-INF/neoforge.mods.toml.
            toml=$(unzip -Z1 "$l2_jar" | grep -E '^META-INF/(neoforge\.)?mods\.toml$' | head -n1)
            [ -n "$toml" ] || { echo "::error::$l2_jar has no META-INF mods toml"; exit 1; }
            unzip -p "$l2_jar" "$toml" > /tmp/l2.toml
            echo "--- $toml ---"; cat /tmp/l2.toml
            grep -A3 'modId = "minecraft"' /tmp/l2.toml | grep -qF "versionRange = \"[$mc_min,$mc_max)\"" \
              || { echo "::error::${{ matrix.loader2 }} minecraft versionRange is not [$mc_min,$mc_max)"; exit 1; }

            unzip -p "$l2_jar" pack.mcmeta > /tmp/l2.mcmeta
            echo "--- pack.mcmeta ---"; cat /tmp/l2.mcmeta
            if [[ "${{ matrix.mc }}" == 26.* ]]; then
              grep -qE "\"min_format\"[[:space:]]*:[[:space:]]*$pack_format[[:space:]]*," /tmp/l2.mcmeta \
                || { echo "::error::${{ matrix.loader2 }} min_format is not $pack_format"; exit 1; }
              grep -qE "\"max_format\"[[:space:]]*:[[:space:]]*$pack_format[[:space:]]*$" /tmp/l2.mcmeta \
                || { echo "::error::${{ matrix.loader2 }} max_format is not $pack_format"; exit 1; }
            else
              grep -qE "\"pack_format\"[[:space:]]*:[[:space:]]*$pack_format[[:space:]]*$" /tmp/l2.mcmeta \
                || { echo "::error::${{ matrix.loader2 }} pack_format is not $pack_format"; exit 1; }
            fi
          else
            echo "Fabric-only version; no second loader to verify."
          fi

          fb_jar=$(ls fabric/versions/${{ matrix.mc }}/build/libs/*fabric.jar \
            | grep -Ev 'sources|dev|raw|client-test|server-test' | head -n1)
          unzip -p "$fb_jar" fabric.mod.json > /tmp/fb.json
          echo "--- fabric.mod.json ---"; cat /tmp/fb.json
          grep -qF "\"minecraft\": \">=$mc_min <$mc_max\"" /tmp/fb.json \
            || { echo "::error::fabric minecraft depend is not >=$mc_min <$mc_max"; exit 1; }

      - name: Dedicated server smoke
        shell: pwsh
        run: ./scripts/run-server-test-matrix.ps1 -Versions '${{ matrix.mc }}'

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libgl1-mesa-dri libegl1 libegl-mesa0 mesa-utils

      - name: Automated client feature tests
        env:
          CI: true
          LIBGL_ALWAYS_SOFTWARE: "1"
          # From 26.3 the game opens its window through SDL and asks for an sRGB-capable
          # framebuffer. GLX under Xvfb has no such visual - "Couldn't find matching GLX visual",
          # then a client that waits on an error dialog until the timeout - while EGL offers one
          # through EGL_KHR_gl_colorspace. Same X display, same llvmpipe, same OpenGL backend a
          # player gets; only the context comes from EGL. Versions on GLFW never read this.
          SDL_VIDEO_FORCE_EGL: "1"
          ALSOFT_DRIVERS: "null"
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            pwsh -NoProfile -File ./scripts/run-client-test-matrix.ps1 -Versions '${{ matrix.mc }}'

      # The same harness, launched from the *packaged* jars instead of the dev classpath:
      # remapped artifacts, intermediary or SRG names, mods discovered the way a launcher discovers
      # them. Nothing above this step can see that layer, and its first runs found three real
      # defects that only exist there.
      #
      # Fabric goes through Loom's ClientProductionRunTask. ModDevGradle ships no equivalent and
      # NeoForge keeps its own production-test tasks inside an unpublished buildSrc plugin, so the
      # Forge family goes through HeadlessMc, which installs a real Minecraft plus the pinned loader
      # build and launches the jars out of a mods folder.
      #
      # The display is set up here rather than left to Loom's own getUseXVFB(), which would start
      # xvfb-run at its default screen. One explicitly sized 24-bit display for every client lane is
      # what makes a screenshot assertion comparable between dev and production - and HeadlessMc
      # needs a real framebuffer too: offline accounts otherwise force its LWJGL stub, which renders
      # nothing at all.
      - name: Production client test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SDL_VIDEO_FORCE_EGL: "1"   # see the dev lane above
          ALSOFT_DRIVERS: "null"
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            pwsh -NoProfile -File ./scripts/run-client-test-matrix.ps1 -Mode prod -Versions '${{ matrix.mc }}'

      # Counted against what the store held when it was linked. Not by file age: a downloader may
      # keep the server's modification time, and the first build on main reported 0 of 5147 that
      # way while its launchers had fetched every one. Zero is the normal answer on a warm store.
      - name: Asset downloads in this job
        if: always()
        run: |
          before=$(cat "$RUNNER_TEMP/mc-assets-linked" 2>/dev/null || echo 0)
          after=$(find ~/mc-assets/objects -type f | wc -l)
          echo "$((after - before)) of $after asset objects were downloaded by this job"

      - name: Save HeadlessMc Minecraft
        if: github.ref == 'refs/heads/main' && matrix.loader2 != '' && steps.hmc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/headlessmc
          key: ${{ steps.hmc.outputs.cache-primary-key }}

      - name: Upload runtime test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mightyarchitect-runtime-tests-${{ matrix.mc }}
          if-no-files-found: warn
          path: |
            build/client-test-results/${{ matrix.mc }}/
            build/prod-client-test-results/${{ matrix.mc }}/
            build/server-test-results/${{ matrix.mc }}/

      - uses: actions/upload-artifact@v7
        with:
          name: mightyarchitect-${{ matrix.mc }}
          if-no-files-found: error
          path: |
            fabric/versions/${{ matrix.mc }}/build/libs/*fabric.jar
            forge/versions/${{ matrix.mc }}/build/libs/*forge.jar
            neoforge/versions/${{ matrix.mc }}/build/libs/*neoforge.jar

  # Single aggregated status to use as the required check in branch protection:
  # a PR only passes when every version builds green and its metadata verifies.
  #
  # A skipped job reports success. So in the duplicate run for a same-repository pull request this
  # job must not be called "All versions green": it would satisfy the required check the moment
  # the pull request opened, while the push build that actually decides it was still running. It
  # also has to RUN there rather than skip, because GitHub only evaluates a job's name when the
  # job runs - skipped, it is listed as the raw expression.
  all-green:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && 'Covered by the push build' || 'All versions green' }}
    needs: [build, source-shape]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any matrix job failed
        run: |
          if [ "${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}" = "true" ]; then
            echo "This commit is built by its branch push; that run's 'All versions green' is the required check."
            exit 0
          fi
          if [ "${{ needs.source-shape.result }}" != "success" ]; then
            echo "The source-shape gate failed."
            exit 1
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "One or more version builds failed."
            exit 1
          fi
          echo "Every version built green on every loader it targets, with production-jar client coverage."
