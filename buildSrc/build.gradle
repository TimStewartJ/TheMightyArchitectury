plugins {
    id "groovy-gradle-plugin"
}

repositories {
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://maven.neoforged.net/releases/" }
    gradlePluginPortal()
    mavenCentral()
}

// Single source of truth for the toolchain versions is the root gradle.properties. buildSrc is a
// separate build and does not inherit those properties, so read the file rather than duplicating
// (and drifting from) the numbers.
def rootProps = new Properties()
file("../gradle.properties").withInputStream { rootProps.load(it) }

// These plugins become available to the convention scripts below, loaded on ONE shared buildSrc
// classloader - so every Stonecutter node reuses a single Loom / ModDevGradle class and sibling
// nodes cannot ClassCastException against each other.
dependencies {
    implementation "net.fabricmc:fabric-loom:${rootProps.loom_version}"
    implementation "net.neoforged.moddev:net.neoforged.moddev.gradle.plugin:${rootProps.moddev_version}"
    // ModDevGradle's legacy addon, released in lockstep with the main plugin. It is what builds
    // the 1.19.4 / 1.20.1 Forge targets, where NeoForge does not exist yet.
    implementation "net.neoforged.moddev.legacyforge:net.neoforged.moddev.legacyforge.gradle.plugin:${rootProps.moddev_version}"
    // Publishes the finished jars to Modrinth / CurseForge. Same shared-classloader argument: one
    // copy of the plugin serves all 25 loader nodes.
    implementation "me.modmuss50.mod-publish-plugin:me.modmuss50.mod-publish-plugin.gradle.plugin:${rootProps.mod_publish_plugin_version}"
}
