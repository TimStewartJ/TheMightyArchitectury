java_version=17
unobfuscated=false
minecraft_version=1.20.1
# NeoForge 1.20.1 (47.x) is Forge-API compatible, so one Forge jar serves both loaders.

fabric_loader_version=0.16.14
fabric_api_version=0.92.11+1.20.1
forge_version=1.20.1-47.3.0

# Metadata dependency ranges (expanded into fabric.mod.json / the loader's mods toml)
meta_mc_range=1.20
meta_mc_max=1.20.2
meta_pack_format=15
meta_forge_range=47
meta_java_range=17

# Listing metadata (Modrinth / CurseForge). meta_game_versions is the INCLUSIVE list the listing
# declares and must stay inside [meta_mc_range, meta_mc_max) - checkPublishMetadata enforces it.
# meta_release_channel: release | beta | alpha.
meta_game_versions=1.20,1.20.1
meta_release_channel=beta
