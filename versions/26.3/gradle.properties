# Minecraft 26.3 is UNOBFUSCATED (loom-no-remap, no mappings), JDK 25.
java_version=25
unobfuscated=true
minecraft_version=26.3

fabric_loader_version=0.19.3
fabric_api_version=0.161.0+26.3
neoforge_version=26.3.0.76

# Metadata dependency ranges (expanded into fabric.mod.json / neoforge.mods.toml)
meta_mc_range=26.3
meta_mc_max=26.4
meta_pack_format=97
meta_neoforge_range=26.3.0
meta_java_range=25

# Listing metadata (Modrinth / CurseForge). meta_game_versions is the INCLUSIVE list the listing
# declares and must stay inside [meta_mc_range, meta_mc_max) - checkPublishMetadata enforces it.
# meta_release_channel: release | beta | alpha. 2.1.0 promoted in place on 2026-10-09.
meta_game_versions=26.3
meta_release_channel=release

# Freecam on the automated dev client run only (fabric/build.gradle): the client test drives the
# real mod's camera against the composer tools. Modrinth version id of freecam-fabric-1.5.1+mc26.3.
freecam_client_test_version=lwrkvqym
# Freecam 1.5.1 requires MixinExtras >=0.5.5; loader 0.19.3 bundles 0.5.4 (0.19.5 bundles 0.5.5).
freecam_client_test_mixinextras=0.5.5
