# Minecraft 26.3 is UNOBFUSCATED (loom-no-remap, no mappings), JDK 25.
java_version=25
unobfuscated=true
minecraft_version=26.3

fabric_loader_version=0.19.3
fabric_api_version=0.161.0+26.3
neoforge_version=26.3.0.6-beta
# This build's decompiled Minecraft does not recompile (HolderSet$1.contents() cannot override
# HolderSet.Named's), which is NeoForge's to fix. Remove once a newer 26.3 build recompiles.
neoforge_disable_recompilation=true

# Metadata dependency ranges (expanded into fabric.mod.json / neoforge.mods.toml)
meta_mc_range=26.3
meta_mc_max=26.4
meta_pack_format=97
meta_neoforge_range=26.3.0
meta_java_range=25

# Listing metadata (Modrinth / CurseForge). meta_game_versions is the INCLUSIVE list the listing
# declares and must stay inside [meta_mc_range, meta_mc_max) - checkPublishMetadata enforces it.
# meta_release_channel: release | beta | alpha. New in 2.1.0: beta until it has users.
meta_game_versions=26.3
meta_release_channel=beta
