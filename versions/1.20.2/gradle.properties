java_version=17
unobfuscated=false
minecraft_version=1.20.2
# Fabric-only. ModDevGradle resolves NeoForge through Gradle module metadata and no 20.2 or
# 20.3 build ever published any, so NeoForge cannot be built for this version at all.

fabric_loader_version=0.16.14
fabric_api_version=0.91.6+1.20.2

# Metadata dependency ranges (expanded into fabric.mod.json / the loader's mods toml)
meta_mc_range=1.20.2
meta_mc_max=1.20.3
meta_pack_format=18
meta_java_range=17

# Listing metadata (Modrinth / CurseForge). meta_game_versions is the INCLUSIVE list the listing
# declares and must stay inside [meta_mc_range, meta_mc_max) - checkPublishMetadata enforces it.
# meta_release_channel: release | beta | alpha. Never published before 2.0.0: beta until it has users.
meta_game_versions=1.20.2
meta_release_channel=beta
