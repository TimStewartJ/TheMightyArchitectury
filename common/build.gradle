// Shared-code node. Deliberately has NO Minecraft toolchain: with a split buildscript there is no
// single mappings namespace both loaders could share, so there is nothing here that could be
// compiled once and consumed by both. Instead this node only exists so Stonecutter processes
// common/src for this Minecraft version; each loader node then compiles the processed directories
// directly (source inclusion). That is what replaces Architectury's cross-project transformer.
apply plugin: "java"

def node = rootProject.project(":${stonecutter.current.version}")

base { archivesName = "${rootProject.archives_base_name}-common" }
version = "${rootProject.mod_version}+mc${node.property('minecraft_version')}"
group = rootProject.maven_group

// Blueprint post-processing shader/effect resources differ per MC version in BOTH format and file
// layout (old GameRenderer.loadEffect PostChain vs new post_effect API; program vs vertex/fragment
// passes; core/screenquad vs post/blit vertex; GLSL #version 120/150/330). A single shared copy in
// common/src can't satisfy all versions, so each node pulls the matching variant set from
// common/shader-variants/<group>/ as an extra resource directory. The loader nodes package
// whatever is on this source set, so declaring it once here covers both of them.
def oldApiVersions = ["1.19.4", "1.20.1", "1.20.2", "1.20.4", "1.20.6", "1.21.1"]  // GameRenderer.loadEffect PostChain (shaders/post + shaders/program)
def t4ShaderVersions = ["1.21.4"]          // transitional: post_effect (program) + shaders/post program def
def p6ShaderVersions = ["1.21.6", "1.21.8"] // post_effect (post/blit vertex) + #version 150 fragment
// Everything newer (1.21.10, 1.21.11, 26.1, ...) uses post_effect (core/screenquad) + #version 330 fragment.
def shaderVariant =
    oldApiVersions.contains(stonecutter.current.version)   ? "old" :
    t4ShaderVersions.contains(stonecutter.current.version) ? "t4"  :
    p6ShaderVersions.contains(stonecutter.current.version) ? "p6"  : "p10"
sourceSets.main.resources.srcDir rootProject.file("common/shader-variants/${shaderVariant}")

// Nothing here can compile or package: Minecraft only exists on the loader nodes' classpaths.
// `stonecutterGenerate` (the task the loader nodes actually depend on) is untouched by this.
tasks.matching { it.name in ["compileJava", "compileTestJava", "jar", "test"] }
    .configureEach { enabled = false }
