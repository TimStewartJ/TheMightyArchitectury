org.gradle.jvmargs=-Xmx3072M
# Architectury's cross-project transform setup requires ordered (non-parallel) configuration;
# parallel config races the transformProduction* artifact wiring between common and loader nodes.
org.gradle.parallel=false
# Configure only the projects a task graph actually needs. Without this, asking for one
# version still evaluates all 32 projects, so an unrelated node's Loom download failure
# fails the requested build (a 1.21.6 mapping download once failed the MC 26.1 CI job).
# Evaluated projects for a single-node build: 32 -> 5.
org.gradle.configureondemand=true

# Mod identity (cross-version constants; per-node toolchain lives in versions/<node>/gradle.properties)
enabled_platforms=fabric,neoforge
archives_base_name=mightyarchitect
# Shared mod version — the mod's OWN SemVer, identical across all Minecraft targets.
# First single-branch release is a beta until the dev-client/visual smoke passes.
# The targeted Minecraft version is carried separately as +mc<version> build metadata.
mod_version=2.0.0-beta.1
maven_group=com.timmie.mightyarchitect

# Standardized toolchain plugin versions (pilot-proven across the 1.21.1..26.2 span)
loom_version=1.17.491
architectury_plugin_version=3.5.169
shadow_version=9.6.1
